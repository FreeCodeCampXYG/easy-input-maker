<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <style>
    text { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #111827; }
    .title { font-size: 26px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12px; fill: #6b7280; }
    .edge-label { font-size: 12px; fill: #374151; }
  </style>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
    <marker id="orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="40" y="46" class="title">EasyInput 音乐配置与播放原理图</text>
  <text x="40" y="72" class="sub">状态基于当前 Maker/Studio 工作区源码；实板发声仍需独立验证</text>

  <rect x="40" y="112" width="250" height="170" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="165" y="145" text-anchor="middle" class="label">Studio（Windows）</text>
  <text x="62" y="177" class="sub">MUS1：音乐参数</text>
  <text x="62" y="199" class="sub">SEQ1：临时曲目事件</text>
  <text x="62" y="221" class="sub">按键/旋钮/节拍器设置</text>
  <text x="62" y="252" class="sub">用户曲目：不落盘，仅当前会话</text>

  <rect x="390" y="112" width="250" height="170" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="515" y="145" text-anchor="middle" class="label">USB HID Vendor</text>
  <text x="412" y="177" class="sub">0x16 / MUS1（63 字节）</text>
  <text x="412" y="199" class="sub">0x17 / SEQ1（63 字节）</text>
  <text x="412" y="221" class="sub">0x11 / Host Action</text>
  <text x="412" y="252" class="sub">下载模式不接收运行时配置</text>

  <rect x="740" y="112" width="250" height="170" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="865" y="145" text-anchor="middle" class="label">Maker 主任务</text>
  <text x="762" y="177" class="sub">严格解码与 ACK</text>
  <text x="762" y="199" class="sub">music_v1：参数 NVS</text>
  <text x="762" y="221" class="sub">SEQ1：RAM 播放队列</text>
  <text x="762" y="252" class="sub">不保存用户曲目</text>

  <path d="M290 170 H390" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#blue)"/>
  <text x="340" y="158" text-anchor="middle" class="edge-label">参数/事件</text>
  <path d="M640 170 H740" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#green)"/>
  <text x="690" y="158" text-anchor="middle" class="edge-label">解码后应用</text>

  <rect x="210" y="370" width="250" height="170" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="335" y="403" text-anchor="middle" class="label">MusicSynth</text>
  <text x="232" y="435" class="sub">根音/MIDI/调式/A4=440</text>
  <text x="232" y="457" class="sub">KEY1—KEY8 音符</text>
  <text x="232" y="479" class="sub">SEQ1 时值/力度</text>
  <text x="232" y="511" class="sub">强拍/弱拍 click</text>

  <rect x="560" y="370" width="250" height="170" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="685" y="403" text-anchor="middle" class="label">SpeakerOutput（唯一 I2S1）</text>
  <text x="582" y="435" class="sub">PCM worker 排程</text>
  <text x="582" y="457" class="sub">钢琴 + 节拍器混音</text>
  <text x="582" y="479" class="sub">旋钮：5%—100% 音量</text>
  <text x="582" y="511" class="sub">AudioIoArbiter / GPIO8</text>

  <path d="M865 282 V330 H335 V370" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#blue)"/>
  <text x="610" y="318" text-anchor="middle" class="edge-label">配置与播放状态</text>
  <path d="M460 455 H560" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#green)"/>
  <text x="510" y="443" text-anchor="middle" class="edge-label">PCM 帧</text>

  <rect x="900" y="370" width="250" height="170" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="1025" y="403" text-anchor="middle" class="label">当前缺口</text>
  <text x="922" y="435" class="sub">多轨鼓机：未实现</text>
  <text x="922" y="457" class="sub">Kick/Snare/Hi-hat 采样：未接入</text>
  <text x="922" y="479" class="sub">语音控制：未实现</text>
  <text x="922" y="511" class="sub">实板听感：待验证</text>
  <path d="M810 455 H900" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="6,4" fill="none" marker-end="url(#orange)"/>

  <rect x="40" y="625" width="1110" height="82" rx="8" fill="#fafafa" stroke="#d1d5db"/>
  <text x="62" y="653" class="label">持久化边界</text>
  <text x="62" y="678" class="sub">music_v1：只保存音乐参数；SEQ1 用户曲目：Maker RAM 当前会话；Studio 编辑文本：不写 settings.json；内置《欢乐颂》是固件公版测试素材例外。</text>
  <line x1="62" y1="699" x2="92" y2="699" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/><text x="100" y="703" class="sub">主数据流</text>
  <line x1="190" y1="699" x2="220" y2="699" stroke="#16a34a" stroke-width="2" marker-end="url(#green)"/><text x="228" y="703" class="sub">音频/应用</text>
  <line x1="330" y1="699" x2="360" y2="699" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#orange)"/><text x="368" y="703" class="sub">未实现/待验证</text>
</svg>
